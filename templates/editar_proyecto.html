{% extends "base.html" %}
{%block title%}Actualizar proyecto{%endblock%}
{% block content%}

<div class="conte_proyecto">
    <div class="contenedor_formulario">
    <form action="{{ url_for('editar_pro', id=proyecto['id']) }}" method="POST">
        <div class="contenedor_campo">
            <label for="">Nombre</label>
            <input type="text" name="nombre" value="{{ proyecto['nombre'] }}" required>
        </div>
        <div class="contenedor_campo">
            <label for="">Descripcion</label>
            <textarea name="descripcion">{{proyecto['descripcion']}} </textarea>
        </div>
        <div class="contenedor_campo">
            <label for="">Imagen</label>
            <input type="text" name="imagen" value="{{ proyecto['imagen'] }}" required>
        </div>
        <div class="contenedor_campo">
            <label for="">Link a github</label>
            <input type="text" name="link_git" value="{{ proyecto['link_git']}}" required>
        </div>
        <div class="contenedor_campo">
            <label for="">Link al proyecto</label>
            <input type="text" name="link_proyecto" value="{{ proyecto['link_proyecto'] }}" required>
        </div>
        <div>
            <button type="submit">Guardar cambios</button>
        </div>
    </form>
</div>
<script src="../static/js/script.js"></script>
</div>

{%endblock%}
