{% extends "base.html" %}
{%block title%}Actualizar sobre mí{%endblock%}
{% block content%}

<div class="conte_proyecto">
    <div class="contenedor_formulario">
    <form action="{{ url_for('editar_sobremi') }}" method="POST" enctype="multipart/form-data">
        <div class="contenedor_campo">
            <label for="">Cargo</label>
            <input type="text" name="cargo" value="{{ mi.cargo }}" required>
        </div>
        <div class="contenedor_campo">
            <label for="">Biografia</label>
            <textarea name="biografia">{{mi.biografia}}</textarea>
        </div>
        <div class="contenedor_campo">
            <label for="">Profesional</label>
            <textarea name="profesional">{{mi.profesional}}</textarea>
        </div>
        <div class="contenedor_campo">
            <label for="">Hobbies</label>
            <textarea name="hobbies">{{mi.hobbies}}</textarea>
        </div>
        <div>
            <button type="submit">Guardar cambios</button>
        </div>
    </form>
</div>
<script src="../static/js/script.js"></script>
</div>

{%endblock%}
