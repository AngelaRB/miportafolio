{% extends "base.html" %}
{%block title%}Proyectos{%endblock%}

{% block content%}

<main>
    <div class="fondo_img">
        <div class="conte_img">
            <header id="titulo_pro">
                <h1>Mis proyectos</h1>
            </header>
            <div class="conte_proyectos">
                {%for proyecto in proyectos%}
                <section>
                    <div class="tarjetas_iconos">
                        <div>
                            {% if session.get('usuario') %}
                            <a href="{{ url_for('editar_pro', id=proyecto['id']) }}">
                                <button class="btn_editar">
                                    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-edit"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" /><path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z" /><path d="M16 5l3 3" /></svg>
                                </button>
                            </a>
                            <a href="{{ url_for('eliminar_pro', id=proyecto['id']) }}">
                                <button class="btn_editar"><svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-trash"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7l16 0" /><path d="M10 11l0 6" /><path d="M14 11l0 6" /><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" /><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" /></svg></button>
                            </a>
                            {% endif %}
                        </div>
                        <div>
                            <a href="{{proyecto.link_git}}" target="_blank">
                                <button class="btn_editar">
                                    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-brand-github"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5" /></svg>
                                </button>
                            </a>
                            <a href="{{proyecto.link_proyecto}}" target="_blank">
                                <button class="btn_editar">
                                    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-elbow-right"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M21 14v-6h-6" /><path d="M21 8l-9 9l-9 -9" /></svg>
                                </button>
                            </a>
                        </div>
                    </div>
                        <div>
                        <h2 id="proyecto_titulo">{{proyecto.nombre}}</h2>
                        <p>{{proyecto.descripcion}}</p>
                    </div>
                    <div class="foto_proyecto">
                        {% if session.get('usuario') %}
                            <a href="{{ url_for('editar_pro_foto', id=proyecto['id']) }}">
                                <button class="btn_editar">
                                    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-edit"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 7h-1a2 2 0 0 0 -2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2 -2v-1" /><path d="M20.385 6.585a2.1 2.1 0 0 0 -2.97 -2.97l-8.415 8.385v3h3l8.385 -8.415z" /><path d="M16 5l3 3" /></svg>
                                </button>
                            </a>
                        {% endif %}
                        <img src="{{ url_for('static', filename='uploads/' + proyecto.imagen) }}" alt="{{proyecto.imagen}}">
                    </div>
                    
                </section>
                {%endfor%}
            </div>
        </div>
    </div>
</main>
    <script src="../static/js/script.js"></script>
</body>

{%endblock%}
